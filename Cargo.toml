[package]
name = "encore"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An Apple Music client for macOS, built with GPUI"
license = "MIT"
repository = "https://github.com/cpreston321/encore"
readme = "README.md"
keywords = ["apple-music", "gpui", "macos", "music-player"]
categories = ["multimedia::audio", "gui"]
publish = false

[dependencies]
anyhow = "1.0.104"
block2 = "0.6"
dirs = "7.0.0"
futures = "0.3"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSGraphics", "NSToolbar", "NSImage", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSGeometry", "NSDictionary", "NSValue", "NSObject", "NSArray"] }
objc2-media-player = { version = "0.3", features = ["MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem", "block2", "objc2-app-kit"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "objc2-app-kit"] }
raw-window-handle = "0.6"
rodio = { version = "0.23", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }

[features]
# Debug-only page tour (ENCORE_TOUR=1), also available in optimized builds for profiling.
tour = []

# GPUI 0.2.2 with one change: the macOS display link sleeps while the window has nothing to
# draw (see vendor/gpui/PATCHES.md).
[patch.crates-io]
gpui = { path = "vendor/gpui" }
