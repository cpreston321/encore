name: Release

# Pushing a tag like v0.2.0 builds Encore.app and attaches it to a draft release, which
# stays unpublished until someone reviews and publishes it. Running the workflow by hand
# builds the same zip as an artifact, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # GitHub's macOS runners are Apple silicon, so the app is arm64 only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi

      # The key stays in the repository's secrets; only a token signed with it goes into the
      # app, valid for 180 days (Apple's limit is six months), so people can sign in without
      # a key of their own. A tag can't be released without it.
      - name: Sign a developer token
        env:
          MUSICKIT_TEAM_ID: ${{ secrets.MUSICKIT_TEAM_ID }}
          MUSICKIT_KEY_ID: ${{ secrets.MUSICKIT_KEY_ID }}
          MUSICKIT_PRIVATE_KEY: ${{ secrets.MUSICKIT_PRIVATE_KEY }}
        run: |
          if [ -z "$MUSICKIT_TEAM_ID" ] || [ -z "$MUSICKIT_KEY_ID" ] || [ -z "$MUSICKIT_PRIVATE_KEY" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "The MUSICKIT_TEAM_ID, MUSICKIT_KEY_ID and MUSICKIT_PRIVATE_KEY secrets are needed to release" >&2
              exit 1
            fi
            echo "No MusicKit secrets; this build asks for a key of its own."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/jwt"
          "$RUNNER_TEMP/jwt/bin/pip" install --quiet "pyjwt[crypto]==2.10.1"
          token=$("$RUNNER_TEMP/jwt/bin/python" - <<'PY'
          import os, time, jwt
          now = int(time.time())
          print(jwt.encode(
              {"iss": os.environ["MUSICKIT_TEAM_ID"], "iat": now, "exp": now + 180 * 24 * 60 * 60},
              os.environ["MUSICKIT_PRIVATE_KEY"],
              algorithm="ES256",
              headers={"kid": os.environ["MUSICKIT_KEY_ID"]},
          ))
          PY
          )
          echo "::add-mask::$token"
          echo "ENCORE_DEVELOPER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "TOKEN_EXPIRES=$(date -u -v+180d +%Y-%m-%d)" >> "$GITHUB_ENV"

      # Signed ad hoc: there's no Developer ID certificate in CI, so people who download it
      # allow it once in Privacy & Security, or re-sign it with ./scripts/sign.sh.
      - name: Build Encore.app
        run: ENCORE_SIGN_IDENTITY=- ENCORE_NO_INSTALL=1 DIST=1 ./scripts/build.sh

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          zip="Encore-$version-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent target/Encore.app "$zip"
          shasum -a 256 "$zip" > SHA256SUMS
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Encore
          path: |
            ${{ env.ZIP }}
            SHA256SUMS

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            SHA256SUMS
