name: Release

# Pushing a tag like v0.2.0 builds Encore.app and attaches it to a draft release, which
# stays unpublished until someone reviews and publishes it. Running the workflow by hand
# builds the same zip as an artifact, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # GitHub's macOS runners are Apple silicon, so the app is arm64 only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi

      # Signed ad hoc: there's no Developer ID certificate in CI, so people who download it
      # allow it once in Privacy & Security, or re-sign it with ./scripts/sign.sh.
      - name: Build Encore.app
        run: ENCORE_SIGN_IDENTITY=- ENCORE_NO_INSTALL=1 DIST=1 ./scripts/build.sh

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          zip="Encore-$version-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent target/Encore.app "$zip"
          shasum -a 256 "$zip" > SHA256SUMS
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Encore
          path: |
            ${{ env.ZIP }}
            SHA256SUMS

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.ZIP }}
            SHA256SUMS
