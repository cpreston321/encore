name: Bug report
description: Something doesn't work or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots help a lot for UI issues.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Public APIs (no MusicKit key)
        - MusicKit key, not signed in
        - Signed in
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run `~/Applications/Encore.app/Contents/MacOS/Encore` from a terminal and paste anything relevant. Remove tokens before posting.
      render: text
